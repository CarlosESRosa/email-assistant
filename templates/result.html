<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - AutoU</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="mb-6">
            <a href="/" class="text-blue-600 hover:text-blue-800 font-medium">← Nova análise</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Classification Result -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">Classificação</h2>
                
                <div class="flex items-center space-x-3 mb-4">
                    {% if label == "Produtivo" %}
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
                            {{ label }}
                        </span>
                    {% else %}
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-800">
                            {{ label }}
                        </span>
                    {% endif %}
                    <span class="text-sm text-gray-600">Confiança: {{ score }}</span>
                </div>

                <div class="bg-gray-50 rounded-md p-4">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Texto analisado:</h3>
                    <pre class="text-sm text-gray-600 whitespace-pre-wrap">{{ text }}</pre>
                </div>
            </div>

            <!-- Suggested Reply -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">Resposta Sugerida</h2>
                
                <div class="space-y-4">
                    <textarea 
                        id="reply_text" 
                        readonly 
                        rows="12" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-50 text-gray-700 resize-none">{{ reply }}</textarea>
                    
                    <button 
                        onclick="copyReply(this)" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                        Copiar Resposta
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function copyReply(btn) {
            const textarea = document.getElementById('reply_text');
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(textarea.value).then(() => {
            const original = btn.textContent;
            btn.textContent = 'Copiado!';
            btn.classList.add('bg-green-600'); btn.classList.remove('bg-blue-600');
            setTimeout(() => {
                btn.textContent = original;
                btn.classList.remove('bg-green-600'); btn.classList.add('bg-blue-600');
            }, 2000);
            });
        }
    </script>
</body>
</html>
