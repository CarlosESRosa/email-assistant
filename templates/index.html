<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoU - Classificador de E-mails</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">AutoU</h1>
            <p class="text-gray-600">Classificador de E-mails Produtivos vs Improdutivos</p>
            <p class="text-sm text-gray-500 mt-2">Nenhum dado é salvo.</p>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label for="email_text" class="block text-sm font-medium text-gray-700 mb-2">
                        Cole o e-mail aqui:
                    </label>
                    <textarea 
                        id="email_text" 
                        name="email_text" 
                        rows="8" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Cole o conteúdo do e-mail que deseja classificar..."></textarea>
                </div>

                <div class="text-center">
                    <span class="text-gray-500 text-sm">ou</span>
                </div>

                <div>
                    <label for="email_file" class="block text-sm font-medium text-gray-700 mb-2">
                        Faça upload de um arquivo:
                    </label>
                    <input 
                        type="file" 
                        id="email_file" 
                        name="email_file" 
                        accept=".txt,.pdf"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Formatos suportados: .txt, .pdf</p>
                </div>

                <div class="text-center">
                    <button 
                        type="submit" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md transition duration-200">
                        Processar
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
